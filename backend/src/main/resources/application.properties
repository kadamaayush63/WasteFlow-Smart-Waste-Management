spring.application.name=waste-flow-backend

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wasteflow?sslMode=DISABLED&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:wasteflow}
spring.datasource.password=${DB_PASSWORD:wasteflow}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.simulation.fill-increase-kg-per-tick=${FILL_INCREASE_KG_PER_TICK:5}
app.thingspeak.channel-id=${THINGSPEAK_CHANNEL_ID:3522933}
app.thingspeak.read-api-key=${THINGSPEAK_READ_API_KEY:S44DBSPAAU989JXE}
app.thingspeak.poll-interval-ms=${THINGSPEAK_POLL_INTERVAL_MS:20000}
