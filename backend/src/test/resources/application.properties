spring.datasource.url=jdbc:h2:mem:wasteflow-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.thingspeak.channel-id=1
app.thingspeak.read-api-key=test-key
app.thingspeak.initial-delay-ms=3600000
app.thingspeak.poll-interval-ms=3600000