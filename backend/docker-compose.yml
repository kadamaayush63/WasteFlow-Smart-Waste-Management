services:
  mysql:
    image: mysql:8.4
    container_name: wasteflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wasteflow
      MYSQL_USER: wasteflow
      MYSQL_PASSWORD: wasteflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - wasteflow_mysql_data:/var/lib/mysql

volumes:
  wasteflow_mysql_data: